<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão · VORTEX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #f0f0f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 340px; }
    .dot {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #8b5cf6, #0a0a0f 70%);
      border: 2px solid #c8f23c;
    }
    h1 { color: #c8f23c; font-size: 20px; margin: 0 0 10px; }
    p { color: #b8b8c8; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
    button {
      background: #c8f23c;
      color: #0a0a0f;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Você está offline</h1>
    <p>Não deu pra conectar no VORTEX agora. Confere sua internet e tenta de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
