<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jogo de Corrida 3D Mobile</title>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background-color: #000;
      touch-action: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 10;
    }

    .speedometer {
      font-size: 32px;
      color: #00e5ff;
    }

    /* CONTROLES TOUCH PARA CELULAR */
    .touch-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: manipulation;
    }

    .touch-btn:active {
      background: rgba(0, 229, 255, 0.5);
    }

    /* Botoes de direcao (Esquerda / Direita) */
    #btn-left {
      bottom: 30px;
      left: 20px;
      width: 70px;
      height: 70px;
    }

    #btn-right {
      bottom: 30px;
      left: 100px;
      width: 70px;
      height: 70px;
    }

    /* Botoes de pedais (Acelerar / Frear) */
    #btn-accel {
      bottom: 30px;
      right: 20px;
      width: 80px;
      height: 80px;
      background: rgba(0, 255, 100, 0.25);
    }

    #btn-brake {
      bottom: 30px;
      right: 110px;
      width: 70px;
      height: 70px;
      background: rgba(255, 50, 50, 0.25);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <span id="speed" class="speedometer">0</span> KM/H
  </div>

  <div id="btn-left" class="touch-btn">◀</div>
  <div id="btn-right" class="touch-btn">▶</div>
  <div id="btn-brake" class="touch-btn">R</div>
  <div id="btn-accel" class="touch-btn">▲</div>

  <div id="canvas-container"></div>

  <script>
    // --- 1. CENA E AMBIENTAÇÃO ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Névoa e céu no estilo do por do sol / arcade
    scene.background = new THREE.Color(0xf39c12);
    scene.fog = new THREE.FogExp2(0xf39c12, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Otimizado para telas de celular
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- 2. ILUMINAÇÃO AVANÇADA ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    sunLight.position.set(50, 80, 50);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    // --- 3. PISTA E CENÁRIO ---
    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3d5a27, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Pista em formato de circuito (Anel Oval)
    const trackCurve = new THREE.EllipseCurve(0, 0, 120, 200, 0, 2 * Math.PI, false, 0);
    const points = trackCurve.getPoints(200);
    
    // Criando o asfalto
    const trackShape = new THREE.Shape();
    trackShape.moveTo(-10, 0);
    trackShape.lineTo(10, 0);

    const geometryTrack = new THREE.ExtrudeGeometry(trackShape, {
      steps: 200,
      bevelEnabled: false,
      extrudePath: new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p.x, 0.05, p.y)))
    });

    const trackMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
    const trackMesh = new THREE.Mesh(geometryTrack, trackMat);
    trackMesh.rotation.x = Math.PI / 2;
    trackMesh.receiveShadow = true;
    scene.add(trackMesh);

    // --- 4. MODELO DO CARRO ESPORTIVO ---
    function createSportsCar() {
      const car = new THREE.Group();

      // Chassi Principal
      const bodyGeo = new THREE.BoxGeometry(1.8, 0.5, 3.8);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, metalness: 0.8, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.4;
      body.castShadow = true;
      car.add(body);

      // Cabine / Vidros
      const cabinGeo = new THREE.BoxGeometry(1.4, 0.45, 1.8);
      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 0.8, -0.2);
      cabin.castShadow = true;
      car.add(cabin);

      // Aerofólio Traseiro
      const spoilerWingGeo = new THREE.BoxGeometry(1.8, 0.08, 0.4);
      const spoilerMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const spoilerWing = new THREE.Mesh(spoilerWingGeo, spoilerMat);
      spoilerWing.position.set(0, 0.95, -1.7);
      
      const spoilerSupportGeo = new THREE.BoxGeometry(0.1, 0.3, 0.2);
      const supp1 = new THREE.Mesh(spoilerSupportGeo, spoilerMat);
      const supp2 = new THREE.Mesh(spoilerSupportGeo, spoilerMat);
      supp1.position.set(-0.6, 0.75, -1.7);
      supp2.position.set(0.6, 0.75, -1.7);
      
      car.add(spoilerWing, supp1, supp2);

      // Faróis Dianteiros
      const lightGeo = new THREE.BoxGeometry(0.4, 0.1, 0.1);
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const headlightL = new THREE.Mesh(lightGeo, lightMat);
      const headlightR = new THREE.Mesh(lightGeo, lightMat);
      headlightL.position.set(-0.6, 0.45, 1.91);
      headlightR.position.set(0.6, 0.45, 1.91);
      car.add(headlightL, headlightR);

      // Rodas Esportivas
      const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 20);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 });

      const wheelPositions = [
        [-0.95, 0.35, 1.1],
        [0.95, 0.35, 1.1],
        [-0.95, 0.35, -1.1],
        [0.95, 0.35, -1.1]
      ];

      wheelPositions.forEach(pos => {
        const wheelGroup = new THREE.Group();
        const tire = new THREE.Mesh(wheelGeo, wheelMat);
        tire.rotation.z = Math.PI / 2;
        tire.castShadow = true;
        
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.31, 8), rimMat);
        rim.rotation.z = Math.PI / 2;

        wheelGroup.add(tire, rim);
        wheelGroup.position.set(...pos);
        car.add(wheelGroup);
      });

      return car;
    }

    const playerCar = createSportsCar();
    playerCar.position.set(120, 0, 0); // Posição inicial na pista
    scene.add(playerCar);

    // --- 5. CONTROLES (TOUCH + TECLADO) ---
    const inputs = { forward: false, backward: false, left: false, right: false };

    // Suporte a Teclado (PC)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') inputs.forward = true;
      if (e.key === 'ArrowDown' || e.key === 's') inputs.backward = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') inputs.forward = false;
      if (e.key === 'ArrowDown' || e.key === 's') inputs.backward = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
    });

    // Suporte a Touch Screen (Celular)
    function bindTouch(elementId, inputKey) {
      const btn = document.getElementById(elementId);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[inputKey] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); inputs[inputKey] = false; });
    }

    bindTouch('btn-accel', 'forward');
    bindTouch('btn-brake', 'backward');
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');

    // --- 6. FÍSICA E ANIMAÇÃO ---
    let speed = 0;
    const maxSpeed = 1.4;
    const acceleration = 0.02;
    const friction = 0.98;
    const turnSpeed = 0.035;

    function animate() {
      requestAnimationFrame(animate);

      // Aceleração
      if (inputs.forward) speed += acceleration;
      if (inputs.backward) speed -= acceleration * 0.6;

      speed *= friction; // Atrito constante

      // Limites de velocidade
      if (speed > maxSpeed) speed = maxSpeed;
      if (speed < -maxSpeed * 0.4) speed = -maxSpeed * 0.4;

      // Curvas
      if (Math.abs(speed) > 0.01) {
        const dir = speed > 0 ? 1 : -1;
        if (inputs.left) playerCar.rotation.y += turnSpeed * dir;
        if (inputs.right) playerCar.rotation.y -= turnSpeed * dir;
      }

      // Movimentação
      playerCar.translateZ(speed);

      // Câmera Suave de Perseguição
      const cameraOffset = new THREE.Vector3(0, 3.5, -9).applyQuaternion(playerCar.quaternion);
      camera.position.copy(playerCar.position).add(cameraOffset);
      camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1, 3).applyQuaternion(playerCar.quaternion)));

      // Atualizar Painel de Velocidade
      document.getElementById('speed').innerText = Math.round(Math.abs(speed) * 160);

      renderer.render(scene, camera);
    }

    // Redimensionamento de tela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
